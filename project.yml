name: TunnelClient

options:
  bundleIdPrefix: com.example.tunnelclient
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.16"
    CURRENT_PROJECT_VERSION: "17"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted

packages:
  SwiftyXrayKit:
    path: Vendor/SwiftyXrayKit

targets:
  TunnelClient:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Resources/App/Assets.xcassets
        buildPhase: resources
      - path: Resources/App/SecurityPolicy.plist
        buildPhase: resources
      - path: Resources/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tunnelclient
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(Client_APP_PROFILE_NAME)
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: PacketTunnelService

  PacketTunnelService:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      - Shared
      - path: Resources/Tunnel/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Tunnel/Geo
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tunnelclient.PacketTunnel
        INFOPLIST_FILE: Config/PacketTunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/PacketTunnel.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(Client_TUNNEL_PROFILE_NAME)
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: SwiftyXrayKit
        product: SwiftyXrayKit
      - framework: Vendor/Tun2ProxyShim.xcframework
        embed: false

  ClientTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tunnelclient.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: TunnelClient
      - package: SwiftyXrayKit
        product: SwiftyXrayKit

  ClientUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tunnelclient.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TunnelClient
    dependencies:
      - target: TunnelClient

schemes:
  TunnelClient:
    build:
      targets:
        TunnelClient: all
        PacketTunnelService: all
        ClientTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClientTests
        - ClientUITests
    archive:
      config: Release
